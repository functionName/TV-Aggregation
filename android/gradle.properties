org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# —— 打包加速 ——
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Windows 上 Pub 缓存在 C:、工程在 D: 时，Kotlin 增量缓存会因跨盘相对路径崩溃
# 若以后把 PUB_CACHE 挪到 D: 盘，可改回 true 进一步加速
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false

# 日常电视包默认只打 armeabi-v7a（可用 -PyingshiAllAbi=true 打全 ABI）
# 快速包跳过 R8：ORG_GRADLE_PROJECT_yingshiFastPack=true
