name: yingshi_daquan
description: 影视聚合 (TV Aggregation) — Flutter Android TV + Web client
publish_to: 'none'
version: 1.0.12+14

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  provider: ^6.1.2
  video_player: ^2.9.2
  collection: ^1.19.0
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  flutter_cache_manager: ^3.4.5
  qr_flutter: ^4.1.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  web:
    generate: true
  image_path: assets/brand/logo_icon.jpg
  adaptive_icon_background: "#141414"
  adaptive_icon_foreground: assets/brand/logo_icon.jpg

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/pinyin/
    - assets/mobile/
    - assets/config/
